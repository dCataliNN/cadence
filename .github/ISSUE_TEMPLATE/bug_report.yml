name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 130 on Windows 11, Safari on iPhone 15
  - type: input
    attributes:
      label: Track or page URL (if relevant)
